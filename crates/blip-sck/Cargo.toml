[package]
name = "blip-sck"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
blip-media-time.workspace = true
blip-audio.workspace = true
block2 = "0.6.2"
dispatch2 = "0.3.0"
objc2 = "0.6.2"
objc2-core-foundation = "0.3.2"
objc2-core-audio-types.workspace = true
objc2-core-audio.workspace = true
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace", "CGDirectDisplay"] }
objc2-core-media = { version = "0.3.2", features = ["CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video.workspace = true
objc2-foundation = "0.3.2"
objc2-io-surface.workspace = true
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCShareableContent", "SCStream"] }
