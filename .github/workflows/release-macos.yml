name: Release macOS

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Production release
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Compute release version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_version="$(cargo pkgid -p blip-capture | perl -ne 'print $1 if /[\@#]([^\@#]+)$/')"
          studio_version="$(cargo pkgid -p blip-studio | perl -ne 'print $1 if /[\@#]([^\@#]+)$/')"
          if [[ "$studio_version" != "$current_version" ]]; then
            echo "Capture and Studio versions must match for a combined release" >&2
            exit 1
          fi

          latest_version="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          if [[ -z "$latest_version" ]]; then
            base_version="$current_version"
          else
            base_version="$(printf '%s\n%s\n' "$current_version" "$latest_version" \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          fi

          IFS=. read -r major minor patch <<< "$base_version"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          VERSION="$version" perl -pi -e 's/^version = "[^"]+"/version = "$ENV{VERSION}"/' \
            apps/blip-capture/Cargo.toml apps/blip-studio/Cargo.toml
          cargo metadata --format-version 1 >/dev/null

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "Release version: $version ($BUMP bump)"

      - name: Set up Apple signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build Blip Capture
        env:
          BLIP_BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: apps/blip-capture/build-app.sh --notarize

      - name: Build Blip Studio
        env:
          BLIP_BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: apps/blip-studio/build-app.sh --notarize

      - name: Generate update feeds
        env:
          BLIP_BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured" >&2
            exit 1
          fi
          version="$(cargo pkgid -p blip-capture | perl -ne 'print $1 if /[\@#]([^\@#]+)$/')"
          studio_version="$(cargo pkgid -p blip-studio | perl -ne 'print $1 if /[\@#]([^\@#]+)$/')"
          if [[ "$studio_version" != "$version" ]]; then
            echo "Capture and Studio versions must match for a combined release" >&2
            exit 1
          fi
          if [[ "$version" != "$RELEASE_VERSION" ]]; then
            echo "Built app version does not match computed release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          capture_signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | target/sparkle-2.9.4/bin/sign_update --ed-key-file - -p target/release/bundle/dmg/Blip-Capture.dmg)"
          studio_signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | target/sparkle-2.9.4/bin/sign_update --ed-key-file - -p target/release/bundle/dmg/Blip-Studio.dmg)"
          apps/generate-appcast.sh \
            "Blip Capture" \
            target/release/bundle/dmg/Blip-Capture.dmg \
            Blip-Capture.dmg \
            target/release/bundle/dmg/Blip-Capture-appcast.xml \
            "$version" "$BLIP_BUILD_NUMBER" "$RELEASE_TAG" "$capture_signature"
          apps/generate-appcast.sh \
            "Blip Studio" \
            target/release/bundle/dmg/Blip-Studio.dmg \
            Blip-Studio.dmg \
            target/release/bundle/dmg/Blip-Studio-appcast.xml \
            "$version" "$BLIP_BUILD_NUMBER" "$RELEASE_TAG" "$studio_signature"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG")
          gh release create "$RELEASE_TAG" \
            target/release/bundle/dmg/Blip-Capture.dmg \
            target/release/bundle/dmg/Blip-Studio.dmg \
            target/release/bundle/dmg/Blip-Capture-appcast.xml \
            target/release/bundle/dmg/Blip-Studio-appcast.xml \
            "${args[@]}"
